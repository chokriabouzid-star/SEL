[workspace]
members = [
    "crates/sel-core",
    "crates/sel-engine",
    "crates/sel-validator",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["SEL Project"]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
