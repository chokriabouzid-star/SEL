[workspace]
resolver = "2"
members = [
    "crates/sel-common",
    "crates/sel-validator",
    "crates/sel-engine",
    "crates/sel-validator-cli",
    "fuzz"
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v5", "serde"] }
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
tempfile = "3.25"
