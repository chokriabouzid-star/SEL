[workspace]
resolver = "2"
members = [
    "crates/sel-common",
    "crates/sel-validator",
    "crates/sel-engine",
    "crates/sel-validator-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.70.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
chrono = "0.4"
uuid = { version = "1.10", features = ["v5"] }
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
tempfile = "3.10"
ed25519-dalek = { version = "2.0", features = ["serde"] }
rand = "0.8"
