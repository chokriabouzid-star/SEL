[package]
name = "sel-engine"
version = "0.2.0"
edition = "2021"
description = "SEL Engine - Sovereign Execution Layer"
license = "MIT"
authors = ["SEL Team"]

[[bin]]
name = "sel-engine"
path = "src/main.rs"

[lib]
name = "sel_engine"
path = "src/lib.rs"

[dependencies]
sel-core = { path = "../sel-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.0"
