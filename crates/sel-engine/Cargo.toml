[package]
name = "sel-engine"
version = "1.0.0"
edition = "2021"
description = "Sovereign Execution Layer - Pure Execution Engine"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
sha2 = "0.10"
thiserror = "1.0"
tempfile = "3.8"
walkdir = "2.4"

# تكامل مع SEL Validator (مكتبة محلية)
sel-validator = { path = "../sel-validator", version = "0.1.0" }

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "sel-engine"
path = "src/main.rs"
serde_json = "1.0"
sha2 = "0.10"
