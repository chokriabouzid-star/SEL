[package]
name = "sel-engine"
version = "1.0.0"
edition = "2024"
description = "SEL Engine - Sovereign Execution Core 1.0 - Fully Deterministic"

[dependencies]
sel-common = { path = "../sel-common" }
sel-validator = { path = "../sel-validator" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }  # 🔴 أضفنا v5
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
