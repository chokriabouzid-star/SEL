[package]
name = "sel-validator"
version = "1.1.0-alpha"
edition = "2024"
description = "SEL Validator - Core 1.1 with Ed25519 support (optional)"

[dependencies]
sel-common = { path = "../sel-common" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
ed25519-dalek = { version = "2.1", features = ["serde"], optional = true }
rand = { version = "0.8", optional = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }

[features]
default = ["hmac"]
hmac = []  # Core 1.0 - deterministic
ed25519 = ["dep:ed25519-dalek", "dep:rand"]  # Core 1.1 - non-repudiation
