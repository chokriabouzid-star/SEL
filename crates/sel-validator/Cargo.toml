[package]
name = "sel-validator"
version = "0.1.0"
edition = "2021"
description = "SEL Validator - Mechanical Pattern Matcher"
authors = ["Sovereign Execution Layer Project"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
regex = "1.0"
semver = "1.0"
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
lazy_static = "1.4"
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"
