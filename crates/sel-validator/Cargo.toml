[package]
name = "sel-validator"
version = "1.0.0"
edition = "2021"
description = "SEL Validator - Sovereign Validation Gateway"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "1.0"
hex = "0.4"  # أضف هذه المكتبة

[lib]
name = "sel_validator"
path = "src/lib.rs"
