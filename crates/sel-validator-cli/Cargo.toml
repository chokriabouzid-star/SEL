[package]
name = "sel-validator-cli"
version = "1.0.0"
edition = "2021"
description = "SEL Validator CLI - Day 4 Implementation"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }

# استخدم sel-validator المحلي
sel-validator = { path = "../sel-validator" }

[[bin]]
name = "sel-validator"
path = "src/main.rs"
